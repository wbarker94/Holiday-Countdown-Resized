<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REI Co-op · Holiday Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#10241C;      /* spruce night sky */
    --pine:#2B5640;       /* forest ridge */
    --ridge:#1A3529;      /* far ridge */
    --snow:#FFFFFF;
    --frost:#CFE1E6;      /* muted text */
    --ember:#D2232A;      /* holiday red */
    --lantern:#F0B64A;    /* warm gold */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{font-family:"Work Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--snow)}

  /* 856 x 559 (about 3:2) at every width, 220px to 900px – same as the weather widget */
  .widget{
    container-type:inline-size;position:relative;overflow:hidden;isolation:isolate;
    width:100%;min-width:220px;max-width:900px;margin:0 auto;
    aspect-ratio:856 / 559;display:flex;flex-direction:column;
    border-radius:clamp(10px,1.6cqi,14px);
    background:
      radial-gradient(120% 80% at 80% 0%, #1E4034 0%, transparent 60%),
      linear-gradient(180deg, var(--night) 0%, #16302A 100%);
  }
  .widget{--accent:var(--ember);--accent-lbl:#FFE3E3}
  .widget[data-h="hanukkah"]{--accent:#2F6DB5;--accent-lbl:#DCE8FF}
  .widget[data-h="kwanzaa"]{--accent:#1F7A3E;--accent-lbl:#DDF3E4}
  .widget[data-h="blackfriday"]{--accent:#111;--accent-lbl:#E6E6E6}
  canvas.snow{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

  .inner{position:relative;z-index:2;flex:1;min-height:0;display:flex;flex-direction:column;padding:2.6cqi 3.4cqi 0}

  /* Header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .badge{background:var(--snow);border-radius:clamp(4px,.9cqi,8px);padding:.55cqi .9cqi;display:inline-flex;line-height:0}
  .logo{height:clamp(14px,4.2cqi,36px);width:auto;display:block}
  .greet{font-family:"Bitter",Georgia,serif;font-weight:500;font-size:clamp(9px,1.7cqi,15px);color:var(--frost);text-align:right;line-height:1.3}

  /* Holiday picker */
  .tabs{display:flex;flex-wrap:wrap;gap:clamp(4px,.8cqi,7px);margin-top:clamp(5px,1.7cqi,15px)}
  .tab{font:inherit;font-size:clamp(9px,1.55cqi,13px);font-weight:600;color:var(--frost);background:rgba(255,255,255,.06);
       border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:.35em .95em;cursor:pointer;white-space:nowrap}
  .tab .when{font-weight:500;opacity:.75;margin-left:.4em}
  .tab[aria-pressed="true"]{background:var(--snow);color:var(--night);border-color:var(--snow)}
  .tab:focus-visible{outline:2px solid var(--lantern);outline-offset:2px}

  h1{font-family:"Bitter",Georgia,serif;font-weight:800;font-size:clamp(14px,4.3cqi,37px);line-height:1.1;
     letter-spacing:-.01em;margin-top:clamp(5px,2cqi,18px)}
  .sub{color:var(--frost);font-size:clamp(9px,1.65cqi,14px);margin-top:.3cqi}

  /* Countdown */
  .clock{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(4px,1.3cqi,11px);margin-top:clamp(5px,1.9cqi,16px)}
  .unit{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:clamp(6px,1.2cqi,10px);
        padding:1.2cqi 2px 1cqi;text-align:center}
  .unit.days{background:var(--accent);border-color:var(--accent)}
  .widget[data-h="kwanzaa"] .unit.days{background:linear-gradient(180deg,#C8102E 0 .6cqi,#111 .6cqi 1.2cqi,#1F7A3E 1.2cqi)}
  .widget[data-h="blackfriday"] .unit.days{box-shadow:inset 0 0 0 2px var(--lantern)}
  .num{font-family:"Bitter",Georgia,serif;font-weight:700;font-size:clamp(18px,7.2cqi,62px);line-height:1;font-variant-numeric:tabular-nums}
  .lbl{font-size:clamp(8px,1.45cqi,13px);color:var(--frost);margin-top:.3cqi}
  .unit.days .lbl{color:var(--accent-lbl)}

  /* Celebration state */
  .merry{display:none;text-align:center;margin-top:clamp(4px,1.6cqi,14px)}
  .merry .big{font-family:"Bitter",Georgia,serif;font-weight:800;font-size:clamp(20px,7.2cqi,62px);color:var(--lantern);line-height:1.05}
  .merry p{color:var(--frost);margin-top:.6cqi;font-size:clamp(9px,1.75cqi,15px)}
  .widget.is-celebrating .clock{display:none}
  .widget.is-celebrating .merry{display:block}

  /* Trail to the summit */
  .trail{position:relative;flex:0 0 auto;margin-top:-2cqi}
  .trail svg{display:block;width:100%;height:auto}
  .trail-meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    font-size:clamp(8px,1.45cqi,13px);color:var(--frost);background:var(--pine);
    padding:.4cqi 3.4cqi 1.3cqi;margin-top:-1px}
  .trail-meta strong{color:var(--lantern);font-weight:600}

  @container (max-width:560px){
    .tab .when,.greet{display:none}
  }
  @container (max-width:380px){
    .sub,.trail-meta{display:none}
    .tabs{gap:3px}
    .tab{padding:.3em .7em}
  }
  @container (max-width:300px){
    h1{display:none}
    .logo{height:14px}
    .tab{font-size:8.5px;padding:.3em .6em}
    .clock,.merry{margin-top:6px}
  }
  @media (prefers-reduced-motion:reduce){ canvas.snow{display:none} .hiker{transition:none} }
</style>
</head>

      <p class="greet">Happy holidays<br>from your co-op</p>
    </div>

    <div class="tabs" id="tabs" aria-label="Choose a holiday"></div>

    <h1 id="xmas-title">Countdown to Christmas</h1>
    <p class="sub" id="sub">Until December 25</p>

    <div class="clock" role="timer" aria-live="off">
      <div class="unit days"><div class="num" id="d">--</div><div class="lbl">days</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="lbl">hours</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="lbl">minutes</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="lbl">seconds</div></div>
    </div>

    <div class="merry">
      <div class="big" id="mbig">Merry Christmas</div>
      <p id="mmsg">Thanks for all you do this season. Now go enjoy some time outside.</p>
    </div>
  </div>

  <!-- Ridgeline: the season is a climb, Christmas is the summit -->
  <div class="trail" aria-hidden="true">
    <svg viewBox="0 0 900 170" preserveAspectRatio="none">
      <path fill="var(--ridge)" d="M0 110 L90 70 L150 95 L240 40 L320 85 L410 55 L500 92 L600 48 L690 80 L780 60 L900 90 L900 170 L0 170Z"/>
      <path id="ridge" fill="var(--pine)" d="M0 150 L120 128 L210 136 L330 104 L420 116 L540 80 L620 92 L740 46 L800 58 L860 30 L900 44 L900 170 L0 170Z"/>
      <!-- snowcap on summit -->
      <path fill="var(--snow)" opacity=".9" d="M845 38 L860 30 L878 39 L868 42 L860 37 L852 43Z"/>
      <!-- trees -->
      <g fill="#0F2219">
        <path d="M60 152 l10 -26 l10 26z"/><path d="M78 152 l8 -20 l8 20z"/>
        <path d="M250 140 l11 -28 l11 28z"/><path d="M270 138 l8 -20 l8 20z"/>
        <path d="M470 118 l10 -26 l10 26z"/><path d="M660 98 l9 -24 l9 24z"/>
      </g>
      <!-- trail line (invisible guide) -->
      <path id="path" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="2 7"
        d="M20 146 L120 128 L210 136 L330 104 L420 116 L540 80 L620 92 L740 46 L800 58 L860 30"/>
      <!-- summit icon: star, menorah or kinara -->
      <g transform="translate(860 18)" id="summit"></g>
      <!-- hiker marker -->
      <g class="hiker" id="hiker">
        <circle r="9" fill="var(--accent)" stroke="var(--snow)" stroke-width="3"/>
      </g>
    </svg>
    <div class="trail-meta">
      <span>Trail to the summit</span>
      <span id="pct"><strong>0%</strong> of the way there</span>
    </div>
  </div>
</section>

<script>
(function(){
  const root = document.getElementById('xmas');
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');

  const DAY = 864e5;
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const SHORT  = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const WEEK   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const fmt  = d => WEEK[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  const md   = d => MONTHS[d.getMonth()] + ' ' + d.getDate();

  // Hanukkah follows the Hebrew calendar: first candle at sundown on these dates
  // (source: Hebcal). Add new years here as needed.
  const HANUKKAH = {2025:[11,14], 2026:[11,4], 2027:[11,24], 2028:[11,12], 2029:[11,1], 2030:[11,20], 2031:[11,9]};
  const PRINCIPLES = [['Umoja','Unity'],['Kujichagulia','Self-determination'],['Ujima','Collective work and responsibility'],
                      ['Ujamaa','Cooperative economics'],['Nia','Purpose'],['Kuumba','Creativity'],['Imani','Faith']];

  const STAR = '<path fill="var(--lantern)" d="M0 -12 L3.5 -3.7 L12 -3.7 L5.2 1.6 L7.6 10 L0 5 L-7.6 10 L-5.2 1.6 L-12 -3.7 L-3.5 -3.7Z"/>';
  function candles(xs, tops, cols){
    return xs.map((x,i) => '<rect x="'+(x-1.1)+'" y="'+tops[i]+'" width="2.2" height="'+(4-tops[i])+'" fill="'+cols[i]+'" stroke="rgba(255,255,255,.55)" stroke-width="'+(cols[i]==='#111'?0.6:0)+'"/>'
      + '<ellipse cx="'+x+'" cy="'+(tops[i]-2.4)+'" rx="1.4" ry="2.3" fill="var(--lantern)"/>').join('');
  }
  const MENORAH = (() => {
    const xs=[-16,-12,-8,-4,0,4,8,12,16], tops=xs.map(x=>x===0?-9:-5), cols=xs.map(()=> '#DCE8FF');
    return candles(xs,tops,cols) + '<rect x="-18" y="4" width="36" height="2.2" rx="1" fill="var(--lantern)"/>'
      + '<rect x="-1.1" y="5" width="2.2" height="7" fill="var(--lantern)"/><rect x="-7" y="11" width="14" height="2.2" rx="1" fill="var(--lantern)"/>';
  })();
  const KINARA = (() => {
    const xs=[-13.5,-9,-4.5,0,4.5,9,13.5], tops=xs.map(()=>-5);
    const cols=['#C8102E','#C8102E','#C8102E','#111','#2E9B57','#2E9B57','#2E9B57'];
    return candles(xs,tops,cols) + '<rect x="-16" y="4" width="32" height="3.2" rx="1.2" fill="#9A6A3A"/>'
      + '<rect x="-12" y="7" width="24" height="3" rx="1" fill="#7A522C"/>';
  })();

  const TENT = '<path d="M0 -12 L13 9 L-13 9Z" fill="var(--lantern)"/><path d="M0 -1 L5.5 9 L-5.5 9Z" fill="#10241C"/><path d="M0 -12 L0 -16" stroke="var(--lantern)" stroke-width="1.8"/>';

  const HOLIDAYS = [
    { id:'blackfriday', name:'Black Friday', title:'#OptOutside', here:'Time to #OptOutside', icon:TENT,
      // The day after Thanksgiving (fourth Thursday of November)
      occ(y){ const first = 1 + ((4 - new Date(y,10,1).getDay() + 7) % 7), bf = first + 22;
              return { start:new Date(y,10,bf), end:new Date(y,10,bf+1) }; },
      upcoming: o => 'All REI stores close ' + fmt(o.start),
      during: () => ({ sub:'All REI stores are closed today', big:'#OptOutside',
                       msg:'Skip the checkout line. Get outside with the people you love.' }) },
    { id:'hanukkah', name:'Hanukkah', icon:MENORAH,
      occ(y){ const d = HANUKKAH[y]; if (!d) return null;
              return { start:new Date(y,d[0],d[1]), end:new Date(y,d[0],d[1]+9) }; },
      upcoming: o => 'First candle at sundown, ' + fmt(o.start),
      during(o, i){
        const last = new Date(o.start.getFullYear(), o.start.getMonth(), o.start.getDate()+8);
        const msg = i <= 7
          ? (i === 0 ? 'Hanukkah begins tonight at sundown. ' : '') + 'Night ' + (i+1) + ' of 8 begins tonight. Wishing you eight bright nights.'
          : 'Today is the final day of Hanukkah. Wishing you and yours a bright season.';
        return { sub: md(o.start) + ' – ' + md(last) + ', ' + last.getFullYear(), big:'Happy Hanukkah', msg };
      } },
    { id:'christmas', name:'Christmas', icon:STAR,
      occ: y => ({ start:new Date(y,11,25), end:new Date(y,11,26) }),
      upcoming: o => 'Until ' + fmt(o.start),
      during: () => ({ sub:'It’s December 25', big:'Merry Christmas',
                       msg:'Thanks for all you do this season. Now go enjoy some time outside.' }) },
    { id:'kwanzaa', name:'Kwanzaa', icon:KINARA,
      occ: y => ({ start:new Date(y,11,26), end:new Date(y,11,33) }),
      upcoming: o => 'Seven days of celebration begin ' + fmt(o.start),
      during(o, i){ const p = PRINCIPLES[Math.min(i,6)];
        return { sub:'December 26 – January 1', big:'Happy Kwanzaa',
                 msg:'Day ' + (i+1) + ' of 7: ' + p[0] + ' (' + p[1] + '). Wishing you a joyful Kwanzaa.' }; } }
  ];

  // Next occurrence that hasn't ended yet (covers holidays that run past New Year's)
  function nextOcc(h, now){
    const y = now.getFullYear();
    for (const yy of [y-1, y, y+1, y+2]) { const o = h.occ(yy); if (o && now < o.end) return o; }
    return null;
  }
  const dayIdx = (now, start) => Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - start) / DAY);

  // Holiday picker
  const tabsEl = $('tabs'), summit = $('summit');
  let chosen = null, manual = false, iconFor = null;
  const btns = {};
  HOLIDAYS.forEach(h => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tab';
    b.innerHTML = h.name + '<span class="when"></span>';
    b.addEventListener('click', () => { chosen = h.id; manual = true; tick(); });
    tabsEl.appendChild(b); btns[h.id] = b;
  });

  function pickDefault(now){
    let best = null, bestT = Infinity;
    for (const h of HOLIDAYS) {
      const o = nextOcc(h, now); if (!o) continue;
      const t = now >= o.start ? -1 : o.start - now;   // happening now wins
      if (t < bestT) { bestT = t; best = h.id; }
    }
    return best;
  }

  const path = $('path'), hiker = $('hiker');
  const len = path.getTotalLength();

  function tick(){
    const now = new Date();
    if (!manual || !chosen) chosen = pickDefault(now);

    // Refresh the picker
    HOLIDAYS.forEach(h => {
      const o = nextOcc(h, now), b = btns[h.id];
      b.hidden = !o;
      if (o) b.querySelector('.when').textContent = SHORT[o.start.getMonth()] + ' ' + o.start.getDate();
      b.setAttribute('aria-pressed', String(h.id === chosen));
    });

    const h = HOLIDAYS.find(x => x.id === chosen);
    const o = h && nextOcc(h, now);
    if (!o) return;
    root.dataset.h = h.id;
    if (iconFor !== h.id) { summit.innerHTML = (h.id === 'christmas' || h.id === 'blackfriday') ? h.icon : '<g transform="translate(0 -2) scale(1.45)">' + h.icon + '</g>'; iconFor = h.id; }

    const active = now >= o.start;
    root.classList.toggle('is-celebrating', active);
    $('xmas-title').textContent = active ? (h.here || h.name + ' is here') : 'Countdown to ' + (h.title || h.name);

    if (active){
      const d = h.during(o, dayIdx(now, o.start));
      $('sub').textContent = d.sub; $('mbig').textContent = d.big; $('mmsg').textContent = d.msg;
      placeHiker(0.955); $('pct').innerHTML = '<strong>Summit reached</strong>';
      return;
    }

    let diff = Math.max(0, o.start - now);
    const dd = Math.floor(diff / DAY); diff -= dd * DAY;
    const hh = Math.floor(diff / 36e5);  diff -= hh * 36e5;
    const mm = Math.floor(diff / 6e4);   diff -= mm * 6e4;
    const ss = Math.floor(diff / 1e3);

    $('d').textContent = dd;
    $('h').textContent = pad(hh);
    $('m').textContent = pad(mm);
    $('s').textContent = pad(ss);
    root.querySelector('.unit.days .lbl').textContent = dd === 1 ? 'day' : 'days';
    $('sub').textContent = h.upcoming(o);

    // The season climb starts Oct 1 and summits on the holiday
    const start = new Date(o.start.getFullYear(), 9, 1);
    const p = Math.min(1, Math.max(0, (now - start) / (o.start - start)));
    placeHiker(p * 0.955);
    $('pct').innerHTML = now < start
      ? 'The climb starts October 1'
      : '<strong>' + Math.round(p*100) + '%</strong> of the way there';
  }

  function placeHiker(p){
    const pt = path.getPointAtLength(len * p);
    hiker.setAttribute('transform', 'translate(' + pt.x + ' ' + (pt.y - 4) + ')');
  }

  tick();
  setInterval(tick, 1000);

  // Gentle snowfall
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cv = root.querySelector('canvas.snow');
  if (reduce || !cv.getContext) return;
  const ctx = cv.getContext('2d');
  let W, H, flakes = [];
  function size(){
    const r = root.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const count = Math.round(W / 9);
    flakes = Array.from({length: count}, () => ({
      x: Math.random()*W, y: Math.random()*H,
      r: Math.random()*1.8 + .6, v: Math.random()*.5 + .25, drift: Math.random()*.6 - .3,
      o: Math.random()*.5 + .35
    }));
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for (const f of flakes){
      f.y += f.v; f.x += f.drift;
      if (f.y > H) { f.y = -4; f.x = Math.random()*W; }
      if (f.x > W) f.x = 0; if (f.x < 0) f.x = W;
      ctx.globalAlpha = f.o; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  new ResizeObserver(size).observe(root);
  size(); draw();
})();
</script>
